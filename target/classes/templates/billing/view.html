<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:600px; margin: 30px auto;">
        <h2>Invoice Details</h2>

        <table style="width:100%;">
            <tr>
                <td style="font-weight:bold; padding:10px; width:40%;">Invoice ID</td>
                <td th:text="${invoice.invoiceId}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">Patient</td>
                <td th:text="${invoice.patient.fullName}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">MRN</td>
                <td th:text="${invoice.patient.mrn}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">Total Amount</td>
                <td th:text="'₹ ' + ${invoice.totalAmount}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">Insurance Coverage</td>
                <td th:text="'₹ ' + ${invoice.insuranceCoverage}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">Patient Payable</td>
                <td th:text="'₹ ' + ${invoice.patientPayable}"></td>
            </tr>
            <tr>
                <td style="font-weight:bold; padding:10px;">Claim Status</td>
                <td>
<span th:text="${invoice.claimStatus}"

      th:classappend="${invoice.claimStatus.name() == 'APPROVED'} ? 'badge-success' :

                                         (${invoice.claimStatus.name() == 'REJECTED'} ? 'badge-danger' :

                                         'badge-warning')"

      class="badge">
</span>
                </td>
            </tr>
        </table>

        <div style="margin-top:20px;">
            <a th:href="@{/billing/edit/{id}(id=${invoice.invoiceId})}"

               class="btn btn-warning">Edit</a>
            <a th:href="@{/billing}" class="btn btn-primary"

               style="margin-left:10px;">Back</a>
        </div>
    </div>
</div>

</body>
</html>
