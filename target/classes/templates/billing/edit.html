<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Invoice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>Edit Invoice</h2>
        <form th:action="@{/billing/edit/{id}(id=${invoice.invoiceId})}"
              method="post">

            <div class="form-group">
                <label>Patient</label>
                <select name="patientId">
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}"
                            th:selected="${p.patientId == invoice.patient.patientId}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Total Amount (₹)</label>
                <input type="number" name="totalAmount"
                       th:value="${invoice.totalAmount}"
                       step="0.01" min="0"/>
            </div>

            <div class="form-group">
                <label>Insurance Coverage (₹)</label>
                <input type="number" name="insuranceCoverage"
                       th:value="${invoice.insuranceCoverage}"
                       step="0.01" min="0"/>
            </div>

            <div class="form-group">
                <label>Claim Status</label>
                <select name="claimStatus">
                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status}"
                            th:selected="${status == invoice.claimStatus}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/billing}" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
