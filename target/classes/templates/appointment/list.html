<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>Appointments</h2>

        <div style="margin-bottom: 16px;">
            <a th:href="@{/appointments/book}" class="btn btn-success">+ Book Appointment</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.appointmentId}"></td>
                <td th:text="${appt.patient.fullName}"></td>
                <td th:text="${appt.doctorName}"></td>
                <td th:text="${appt.appointmentDate}"></td>
                <td th:text="${appt.appointmentTime}"></td>
                <td th:text="${appt.appointmentStatus}"></td>
                <td>
                    <a th:href="@{/appointments/edit/{id}(id=${appt.appointmentId})}"
                       class="btn btn-warning">Edit</a>
                    <a th:href="@{/appointments/delete/{id}(id=${appt.appointmentId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Delete this appointment?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="7" style="text-align:center; color:#999;">
                    No appointments found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
