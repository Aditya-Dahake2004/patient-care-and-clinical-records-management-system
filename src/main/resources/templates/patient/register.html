<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 550px; margin: 30px auto;">
        <h2>Register New Patient</h2>
        <form th:action="@{/patients/register}" th:object="${patient}" method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" placeholder="Enter full name"/>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" th:field="*{dateOfBirth}"/>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select th:field="*{gender}">
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" th:field="*{contactNumber}" placeholder="Enter 10 digit number"/>
            </div>

            <button type="submit" class="btn btn-success">Register</button>
            <a th:href="@{/patients}" class="btn btn-danger" style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
