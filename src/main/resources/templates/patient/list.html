<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>Patient List</h2>

        <div class="search-bar">
            <form th:action="@{/patients/search}" method="get"
                  style="display:flex; gap:10px;">
                <input type="text" name="keyword" placeholder="Search by name or MRN"/>
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/patients}" class="btn btn-warning">Reset</a>
            </form>
            <a th:href="@{/patients/register}" class="btn btn-success">+ Register Patient</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>MRN</th>
                <th>Full Name</th>
                <th>Date of Birth</th>
                <th>Gender</th>
                <th>Contact</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.mrn}"></td>
                <td th:text="${patient.fullName}"></td>
                <td th:text="${patient.dateOfBirth}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.contactNumber}"></td>
                <td>
                    <a th:href="@{/patients/edit/{id}(id=${patient.patientId})}"
                       class="btn btn-warning">Edit</a>
                    <a th:href="@{/patients/delete/{id}(id=${patient.patientId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Delete this patient?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="6" style="text-align:center; color:#999;">
                    No patients found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
