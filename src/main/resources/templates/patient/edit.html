<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 550px; margin: 30px auto;">
        <h2>Edit Patient</h2>
        <form th:action="@{/patients/edit/{id}(id=${patient.patientId})}"
              th:object="${patient}" method="post">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" th:field="*{dateOfBirth}"
                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('dateOfBirth')}"
                      th:errors="*{dateOfBirth}"></span>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select th:field="*{gender}"
                        th:classappend="${#fields.hasErrors('gender')} ? 'input-error'">
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error-msg" th:if="${#fields.hasErrors('gender')}"
                      th:errors="*{gender}"></span>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" th:field="*{contactNumber}"
                       th:classappend="${#fields.hasErrors('contactNumber')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('contactNumber')}"
                      th:errors="*{contactNumber}"></span>
            </div>

            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/patients}" class="btn btn-danger" style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
