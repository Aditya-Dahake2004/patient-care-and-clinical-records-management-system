<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinical Records</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>Electronic Health Records</h2>

        <div style="margin-bottom: 16px;">
            <a th:href="@{/ehr/create}" class="btn btn-success">+ Add Record</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Encounter Date</th>
                <th>Diagnosis Code</th>
                <th>Vitals Summary</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.recordId}"></td>
                <td th:text="${record.patient.fullName}"></td>
                <td th:text="${record.encounterDate}"></td>
                <td th:text="${record.diagnosisCode}"></td>
                <td th:text="${record.vitalsSummary}"></td>
                <td>
                    <a th:href="@{/ehr/view/{id}(id=${record.recordId})}"
                       class="btn btn-primary">View</a>
                    <a th:href="@{/ehr/edit/{id}(id=${record.recordId})}"
                       class="btn btn-warning">Edit</a>
                    <a th:href="@{/ehr/delete/{id}(id=${record.recordId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Delete this record?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="6" style="text-align:center; color:#999;">
                    No records found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
