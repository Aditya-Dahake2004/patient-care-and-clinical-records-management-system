<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prescriptions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>Prescriptions</h2>

        <div style="margin-bottom: 16px;">
            <a th:href="@{/prescriptions/create}" class="btn btn-success">
                + New Prescription
            </a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Medication</th>
                <th>Dosage</th>
                <th>Frequency</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prescriptions}">
                <td th:text="${p.prescriptionId}"></td>
                <td th:text="${p.patient.fullName}"></td>
                <td th:text="${p.medicationName}"></td>
                <td th:text="${p.dosage}"></td>
                <td th:text="${p.frequency}"></td>
                <td>
                        <span th:text="${p.dispenseStatus}"
                              th:classappend="${p.dispenseStatus.name() == 'DISPENSED'} ? 'badge-success' :
                                             (${p.dispenseStatus.name() == 'CANCELLED'} ? 'badge-danger' :
                                             'badge-warning')"
                              class="badge">
                        </span>
                </td>
                <td>
                    <a th:if="${p.dispenseStatus.name() == 'PENDING'}"
                       th:href="@{/prescriptions/dispense/{id}(id=${p.prescriptionId})}"
                       class="btn btn-success"
                       onclick="return confirm('Dispense this medication?')">Dispense</a>
                    <a th:href="@{/prescriptions/edit/{id}(id=${p.prescriptionId})}"
                       class="btn btn-warning">Edit</a>
                    <a th:href="@{/prescriptions/delete/{id}(id=${p.prescriptionId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Delete this prescription?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(prescriptions)}">
                <td colspan="7" style="text-align:center; color:#999;">
                    No prescriptions found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
