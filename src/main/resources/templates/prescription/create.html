<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Prescription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>New Prescription</h2>
        <form th:action="@{/prescriptions/create}" th:object="${prescription}" method="post">

            <div class="form-group">
                <label>Patient</label>
                <select th:field="*{patient.patientId}"
                        th:classappend="${#fields.hasErrors('patient.patientId')} ? 'input-error'">
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}">
                    </option>
                </select>
                <span class="error-msg" th:if="${#fields.hasErrors('patient.patientId')}"
                      th:errors="*{patient.patientId}"></span>
            </div>

            <div class="form-group">
                <label>Medication Name</label>
                <input type="text" th:field="*{medicationName}"
                       placeholder="Enter medication name"
                       th:classappend="${#fields.hasErrors('medicationName')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('medicationName')}"
                      th:errors="*{medicationName}"></span>
            </div>

            <div class="form-group">
                <label>Dosage</label>
                <input type="text" th:field="*{dosage}"
                       placeholder="e.g. 500mg"
                       th:classappend="${#fields.hasErrors('dosage')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('dosage')}"
                      th:errors="*{dosage}"></span>
            </div>

            <div class="form-group">
                <label>Frequency</label>
                <input type="text" th:field="*{frequency}"
                       placeholder="e.g. Twice daily"
                       th:classappend="${#fields.hasErrors('frequency')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('frequency')}"
                      th:errors="*{frequency}"></span>
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/prescriptions}" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
