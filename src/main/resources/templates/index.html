<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PCCRMS - Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="text-align:center; padding: 40px;">
        <h2>Welcome to PCCRMS</h2>
        <p style="color:#777; margin-bottom:30px; font-size:15px;">
            Patient Care & Clinical Records Management System
        </p>

        <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">

            <a th:href="@{/patients}" class="dashboard-card">
                <div class="dash-icon">👤</div>
                <div>Patients</div>
            </a>

            <a th:href="@{/appointments}" class="dashboard-card">
                <div class="dash-icon">📅</div>
                <div>Appointments</div>
            </a>

            <a th:href="@{/ehr}" class="dashboard-card">
                <div class="dash-icon">🏥</div>
                <div>EHR</div>
            </a>

            <a th:href="@{/prescriptions}" class="dashboard-card">
                <div class="dash-icon">💊</div>
                <div>Prescriptions</div>
            </a>

            <a th:href="@{/billing}" class="dashboard-card">
                <div class="dash-icon">🧾</div>
                <div>Billing</div>
            </a>

        </div>
    </div>
</div>

</body>
</html>
