<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Appointment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>Edit Appointment</h2>
        <form th:action="@{/appointments/edit/{id}(id=${appointment.appointmentId})}"
              th:object="${appointment}" method="post">

            <div class="form-group">
                <label>Patient</label>
                <select name="patientId"
                        th:classappend="${#fields.hasErrors('patient')} ? 'input-error'">
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}"
                            th:selected="${p.patientId == appointment.patient.patientId}">
                    </option>
                </select>
                <span class="error-msg" th:if="${#fields.hasErrors('patient')}"
                      th:errors="*{patient}"></span>
            </div>

            <div class="form-group">
                <label>Doctor Name</label>
                <input type="text" th:field="*{doctorName}"
                       th:classappend="${#fields.hasErrors('doctorName')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('doctorName')}"
                      th:errors="*{doctorName}"></span>
            </div>

            <div class="form-group">
                <label>Appointment Date</label>
                <input type="date" th:field="*{appointmentDate}"
                       th:classappend="${#fields.hasErrors('appointmentDate')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('appointmentDate')}"
                      th:errors="*{appointmentDate}"></span>
            </div>

            <div class="form-group">
                <label>Appointment Time</label>
                <input type="time" th:field="*{appointmentTime}"
                       th:classappend="${#fields.hasErrors('appointmentTime')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('appointmentTime')}"
                      th:errors="*{appointmentTime}"></span>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{appointmentStatus}"
                        th:classappend="${#fields.hasErrors('appointmentStatus')} ? 'input-error'">
                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status}">
                    </option>
                </select>
                <span class="error-msg" th:if="${#fields.hasErrors('appointmentStatus')}"
                      th:errors="*{appointmentStatus}"></span>
            </div>

            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/appointments}" class="btn btn-danger" style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
