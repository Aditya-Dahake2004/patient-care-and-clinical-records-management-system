<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>Book Appointment</h2>
        <form th:action="@{/appointments/book}" method="post">

            <div class="form-group">
                <label>Patient</label>
                <select name="patientId">
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Doctor Name</label>
                <input type="text" name="doctorName" placeholder="Enter doctor name"/>
            </div>

            <div class="form-group">
                <label>Appointment Date</label>
                <input type="date" name="appointmentDate"/>
            </div>

            <div class="form-group">
                <label>Appointment Time</label>
                <input type="time" name="appointmentTime"/>
            </div>

            <button type="submit" class="btn btn-success">Book</button>
            <a th:href="@{/appointments}" class="btn btn-danger" style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
