<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generate Invoice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>Generate Invoice</h2>
        <form th:action="@{/billing/create}" method="post">

            <div class="form-group">
                <label>Patient</label>
                <select name="patientId">
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Total Amount (₹)</label>
                <input type="number" name="totalAmount"
                       placeholder="Enter total amount"
                       step="0.01" min="0"/>
            </div>

            <div class="form-group">
                <label>Insurance Coverage (₹)</label>
                <input type="number" name="insuranceCoverage"
                       placeholder="Enter insurance coverage"
                       step="0.01" min="0"/>
            </div>

            <p style="font-size:13px; color:#777; margin-bottom:16px;">
                * Patient payable will be auto calculated.
            </p>

            <button type="submit" class="btn btn-success">Generate</button>
            <a th:href="@{/billing}" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
