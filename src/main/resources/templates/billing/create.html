<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generate Invoice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">PCCRMS</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/appointments}">Appointments</a>
        <a th:href="@{/ehr}">EHR</a>
        <a th:href="@{/prescriptions}">Prescriptions</a>
        <a th:href="@{/billing}">Billing</a>

        <div class="admin-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width:550px; margin: 30px auto;">
        <h2>Generate Invoice</h2>
        <form th:action="@{/billing/create}" th:object="${invoice}" method="post">

            <div class="form-group">
                <label>Patient</label>
                <select name="patientId"
                        th:classappend="${#fields.hasErrors('patient')} ? 'input-error'">
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}"
                            th:value="${p.patientId}"
                            th:text="${p.fullName + ' (' + p.mrn + ')'}">
                    </option>
                </select>
                <span class="error-msg" th:if="${#fields.hasErrors('patient')}"
                      th:errors="*{patient}"></span>
            </div>

            <div class="form-group">
                <label>Total Amount (₹)</label>
                <input type="number" th:field="*{totalAmount}"
                       placeholder="Enter total amount"
                       step="0.01" min="0"
                       th:classappend="${#fields.hasErrors('totalAmount')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('totalAmount')}"
                      th:errors="*{totalAmount}"></span>
            </div>

            <div class="form-group">
                <label>Insurance Coverage (₹)</label>
                <input type="number" th:field="*{insuranceCoverage}"
                       placeholder="Enter insurance coverage"
                       step="0.01" min="0"
                       th:classappend="${#fields.hasErrors('insuranceCoverage')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('insuranceCoverage')}"
                      th:errors="*{insuranceCoverage}"></span>
            </div>

            <div class="form-group">
                <label>Patient Payable (₹)</label>
                <input type="number" th:field="*{patientPayable}"
                       placeholder="Auto-calculated"
                       step="0.01" min="0"
                       th:classappend="${#fields.hasErrors('patientPayable')} ? 'input-error'"/>
                <span class="error-msg" th:if="${#fields.hasErrors('patientPayable')}"
                      th:errors="*{patientPayable}"></span>
            </div>


            <button type="submit" class="btn btn-success">Generate</button>
            <a th:href="@{/billing}" class="btn btn-danger"
               style="margin-left:10px;">Cancel</a>

        </form>
    </div>
</div>

</body>
</html>
